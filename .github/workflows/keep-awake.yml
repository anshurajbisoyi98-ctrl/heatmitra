# Render's free plan puts the demo to sleep after 15 idle minutes, and waking it takes up to a minute.
# Ping it every 10 minutes while judges may be looking (until the GITEX awards, 11 Dec 2026).
# One always-on free service uses about 720 of Render's 750 free hours a month.
name: Keep the demo awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the live demo during the judging window
        run: |
          if [[ "$(date -u +%Y-%m-%d)" > "2026-12-12" ]]; then echo "Judging window is over; not pinging."; exit 0; fi
          curl -sS -m 120 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" https://heatmitra.onrender.com/api/config
